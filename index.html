<form onsubmit="return check(event)">
  <input id="mark" type="text">
  <button id="submit">Submit</button>
</form>
<p id="result"></p>
<script>
function check(e){
  e.preventDefault();
  const v = document.getElementById("mark").value.trim();
  const n = Number(v);
  const r = document.getElementById("result");
  if (v !== "" && Number.isInteger(n) && n >= 0 && n <= 10)
    r.textContent = "Accepted";
  else r.textContent = "Rejected";
}
</script>
